name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS Apple Clang (ARM64)
            os: macos-14
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-latest
            cc: cl
            cxx: cl
          - name: Windows clang-cl
            os: windows-latest
            cc: clang-cl
            cxx: clang-cl
            cmake_args: -T ClangCL
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFASTPATTERN_BUILD_BENCHMARKS=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --verbose --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix install

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFASTPATTERN_SANITIZE=ON -DFASTPATTERN_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --verbose --output-on-failure

  portable:
    name: Portable scalar shared-library build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFASTPATTERN_DISABLE_SIMD=ON -DBUILD_SHARED_LIBS=ON -DFASTPATTERN_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --verbose --output-on-failure
